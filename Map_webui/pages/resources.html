<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="./resources.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div><p class="eyebrow">Reference Library</p><h1>Resources</h1></div>
        <nav><a href="../index.html">Dashboard</a></nav>
    </header>
    <main class="resourcePage">
        <p>Browse the categories and click a filename to download it.</p>
        <div class="resourceActions">
            <button id="expandAll" type="button" disabled>Expand all</button>
            <button id="collapseAll" type="button" disabled>Collapse all</button>
        </div>
        <p id="resourceStatus" role="status">Loading resources…</p>
        <div id="resourceTree" aria-label="Resources by folder"></div>
        <noscript>Enable JavaScript to browse the resource library.</noscript>
    </main>
</body>
</html>
